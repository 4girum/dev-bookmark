name: Keep Database Awake 💓

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Send Database Heartbeat Ping
        run: |          
          if [ -z "${{ secrets.PUBLIC_APP_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Error: Secrets are missing!"
            exit 1
          else
            # Updates the last_ping timestamp of row id = 1 via PostgREST PATCH request
            RESPONSE=$(curl -s -L -o /dev/null -w "%{http_code}" \
              -X PATCH "${{ secrets.PUBLIC_APP_URL }}/rest/v1/heartbeat?id=eq.1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"last_ping": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}')
            
            echo "HTTP Status Code: $RESPONSE"
            
            if [ "$RESPONSE" -eq 204 ] || [ "$RESPONSE" -eq 200 ]; then
              echo "Successfully updated the database timestamp! Heartbeat recorded. 💓"
            else
              echo "Failed with HTTP status code: $RESPONSE"
              exit 1
            fi
          fi