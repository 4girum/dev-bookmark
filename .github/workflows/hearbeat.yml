name: Keep Database Awake 💓

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Ping
        run: |          
          if [ -z "${{ secrets.PUBLIC_APP_URL }}" ]; then
            echo "Secret is empty!"
            exit 1
          else
            curl -s "${{ secrets.PUBLIC_APP_URL }}" > /dev/null
            echo "Secret is securely loaded and accessible."
          fi