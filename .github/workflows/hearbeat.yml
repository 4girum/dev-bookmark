name: Keep Database Awake 💓

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Send Database Heartbeat Ping
        run: |          
          if [ -z "${{ secrets.PUBLIC_APP_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Error: Secrets are missing!"
            exit 1
          else
            # Queries the heartbeat table directly via Supabase PostgREST API
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X GET "${{ secrets.PUBLIC_APP_URL }}/rest/v1/heartbeat?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            
            echo "HTTP Status Code: $RESPONSE"
            
            if [ "$RESPONSE" -eq 200 ]; then
              echo "Successfully touched the database! Heartbeat recorded. 💓"
            else
              echo "Failed with HTTP status code: $RESPONSE"
              exit 1
            fi
          fi