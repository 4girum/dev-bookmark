name: Keep Database Awake 💓

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Ping
        run: |          
          if [ -z "${{ secrets.PUBLIC_APP_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Secrets are empty!"
            exit 1
          else
            # This forces PostgREST to authenticate and touch the DB schema layer
            curl -s -X GET "${{ secrets.PUBLIC_APP_URL }}/rest/v1/" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
            
            echo "Heartbeat securely sent directly to the API layer."
          fi